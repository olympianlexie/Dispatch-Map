<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Dispatch Map</h1>
    <div class="filters">
      <label>Cluster <select id="filter-cluster"><option value="all">All</option></select></label>
      <label>Municipality <select id="filter-municipality"><option value="all">All</option></select></label>
      <label>SLA <select id="filter-sla">
        <option value="all">All</option>
        <option value="withinSla">Within SLA</option>
        <option value="nearBreach">Near breach</option>
        <option value="breached">Breached</option>
        <option value="unknown">Unknown date</option>
      </select></label>
      <label>Assigned <select id="filter-assignment">
        <option value="all">All</option>
        <option value="assigned">Assigned</option>
        <option value="unassigned">Unassigned</option>
      </select></label>
      <label><input type="checkbox" id="toggle-jos" checked /> JOs</label>
      <label><input type="checkbox" id="toggle-vehicles" checked /> Vehicles</label>
    </div>
    <span id="last-updated" class="status-text">Loading&hellip;</span>
  </header>

  <main class="layout">
    <div id="map"></div>
    <aside class="side-panel">
      <h2>Barangays by urgency</h2>
      <ul id="barangay-ranking" class="rank-list"></ul>

      <h2>Needs coordinates <a href="/admin/unmatched-barangays.html">(fix &rarr;)</a></h2>
      <ul id="unmatched-list" class="unmatched-list"></ul>
    </aside>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/vehicles.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
